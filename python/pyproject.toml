[build-system]
requires = ["setuptools>=78", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "welllog-engine"
version = "0.1.0"
description = "Offline well-log processing application engine"
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
    "dlisio>=1.0,<2",
    "duckdb>=1.3,<2",
    "fastapi>=0.115,<1",
    "h5py>=3.11,<4",
    "lasio>=0.32,<1",
    "lxml>=5,<7",
    "pyarrow>=18,<23",
    "pydantic>=2.10,<3",
    "typer>=0.16,<1",
    "uvicorn>=0.34,<1",
    "zarr>=3,<4",
]

[project.optional-dependencies]
dev = [
    "httpx>=0.27,<1",
    "mypy>=1.15,<2",
    "pytest>=8,<10",
    "ruff>=0.12,<1",
]

[project.scripts]
welllog = "welllog_engine.cli.main:run"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["B", "E", "F", "I", "UP"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src", "tests"]
